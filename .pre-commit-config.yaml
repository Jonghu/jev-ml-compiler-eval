repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: Check formatting with Ruff
        entry: uv run ruff format --check .
        language: system
        pass_filenames: false

      - id: ruff-lint
        name: Lint with Ruff
        entry: uv run ruff check .
        language: system
        pass_filenames: false

      - id: pytest
        name: Run tests with pytest
        entry: uv run pytest
        language: system
        pass_filenames: false
