  <g id="text_31">
   <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #536576" transform="translate(19.44 323.2)">These are observed groups, not a controlled size ablation. Candidate count is confounded with workload identity;</text>
   <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #536576" transform="translate(19.44 338.4)">the sample is highly unbalanced. Scores are recomputed from saved runtime maps, retaining failure-sentinel records.</text>
