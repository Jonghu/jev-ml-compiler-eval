# Ablation A5 of docs/tpugraphs-ablation-plan.md on the full valid split.
# All 676 valid kernels with all distinct configurations (as in R7 and the
# paper). Jev sees both descriptions and only the 50 largest tiles, so every
# kernel is one Choice question. Blind: neutral IDs and a shuffled order seeded
# by "42:<workload_id>".
schema_version: 1

experiment:
  name: tpugraphs-ablation-full-valid-a5-keep-largest-50
  description: >-
    A5 on all 676 valid kernels: both descriptions, only the 50 largest tiles shown, three repeats.
  seed: 42
  output_dir: results/tpugraphs/ablation-full-valid/runs/a5-keep-largest-50

dataset:
  type: tpugraphs-tile
  config:
    path: data/tpugraphs/npz/tile/xla/valid
    # Above the largest distinct-configuration count (9,988), so no kernel is skipped.
    max_candidates: 10000
    describe_config_fields: true
    describe_graph_fields: true

candidate_selection:
  strategy: all

models:
  - id: random
    type: random
    config:
      seed: 42

  - id: a5-keep-largest-50-rep1
    type: jev-tournament
    config:
      model: jev-1.14.0
      # One cache directory per repeat: identical requests of different
      # repeats are sent live, so the repeats measure response variation.
      cache_dir: results/tpugraphs/ablation-full-valid/jev-cache/rep1
      max_retries: 3
      request_timeout_seconds: 60.0
      order_seed: 42
      candidate_ids: opaque
      keep_largest: 50
      size_fields: [output_bounds, kernel_bounds]
      max_options: 255
      advance_per_question: 5
      max_request_tokens: 56000
      max_state_question_tokens: 28000
      chars_per_token: 1.4
      max_requests_per_minute: 960
      max_tokens_per_second: 200000

  - id: a5-keep-largest-50-rep2
    type: jev-tournament
    config:
      model: jev-1.14.0
      # One cache directory per repeat: identical requests of different
      # repeats are sent live, so the repeats measure response variation.
      cache_dir: results/tpugraphs/ablation-full-valid/jev-cache/rep2
      max_retries: 3
      request_timeout_seconds: 60.0
      order_seed: 42
      candidate_ids: opaque
      keep_largest: 50
      size_fields: [output_bounds, kernel_bounds]
      max_options: 255
      advance_per_question: 5
      max_request_tokens: 56000
      max_state_question_tokens: 28000
      chars_per_token: 1.4
      max_requests_per_minute: 960
      max_tokens_per_second: 200000

  - id: a5-keep-largest-50-rep3
    type: jev-tournament
    config:
      model: jev-1.14.0
      # One cache directory per repeat: identical requests of different
      # repeats are sent live, so the repeats measure response variation.
      cache_dir: results/tpugraphs/ablation-full-valid/jev-cache/rep3
      max_retries: 3
      request_timeout_seconds: 60.0
      order_seed: 42
      candidate_ids: opaque
      keep_largest: 50
      size_fields: [output_bounds, kernel_bounds]
      max_options: 255
      advance_per_question: 5
      max_request_tokens: 56000
      max_state_question_tokens: 28000
      chars_per_token: 1.4
      max_requests_per_minute: 960
      max_tokens_per_second: 200000

metrics:
  - runtime_regret
  - top_1_accuracy
  - top_1_error
  - top_5_error
  - top_10_error
  - kendall_tau

execution:
  fail_fast: true
