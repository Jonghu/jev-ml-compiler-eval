[project]
name = "jev-ml-compiler-eval"
version = "0.1.0"
description = "Evaluate Jev on ML compiler optimization decisions."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "python-dotenv>=1.2.4,<2",
    "pyyaml>=6.0,<7",
    "typesafe-sdk>=0.7.5,<0.8",
]

[dependency-groups]
dev = [
    "pre-commit>=4.3,<5",
    "pytest>=8.4,<9",
    "ruff>=0.14,<0.15",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jev_compiler_eval"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]
